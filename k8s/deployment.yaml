apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-plan
  namespace: sdata

spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: ms-plan

  template:
    metadata:
      labels:
        app: ms-plan

    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

      containers:
      - name: ms-plan
        image: ms-plan:latest
        imagePullPolicy: IfNotPresent

        ports:
        - name: grpc
          containerPort: 50051

        envFrom:
        - configMapRef:
            name: ms-plan-config
        - secretRef:
            name: ms-plan-secret

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        readinessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        startupProbe:
          tcpSocket:
            port: grpc
          failureThreshold: 30
          periodSeconds: 5

        livenessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3

        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
