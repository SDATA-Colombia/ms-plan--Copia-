# SonarQube - ms-plan
# Analisis:  make sonar   (requiere SONAR_TOKEN y un SonarQube accesible en sonar.host.url)

sonar.projectKey=ms-plan
sonar.projectName=ms-plan (SDATA)
sonar.projectVersion=1.0
sonar.host.url=http://localhost:9000

sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=**/vendor/**,**/*.pb.go,**/*_test.go,tests/**,k6/**,scripts/**,docs/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Cobertura y resultados de go test (los genera `make cover`)
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.json
sonar.coverage.exclusions=**/*.pb.go,cmd/**,tests/**
